<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Private guest pages replace the title at runtime after token validation. -->
    <title>Undangan Pernikahan Pribadi</title>
    <meta name="description" content="Undangan pribadi. Gunakan tautan tamu yang dikirimkan oleh pengantin." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Undangan Pernikahan Pribadi" />
    <meta property="og:description" content="Gunakan tautan tamu yang dikirimkan oleh pengantin." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#747963" />
    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Only what the closed cover actually paints (see orn-cover-* in src/config/slots.ts).
         Preloading anything else just competes for bandwidth on the first screen. -->
    <link rel="preload" as="image" href="/assets/mix-corner.webp" />
    <link rel="preload" as="image" href="/assets/mix-wreath.webp" />
    <!-- A solid colour is intentionally defined before CSS/JS load. It is a
         reliable fallback in Samsung Internet and on a slow connection. -->
    <style>html,body,#root{min-height:100%;margin:0;background:#F3EADB}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
