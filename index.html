<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Private guest pages replace the title at runtime after token validation. -->
    <title>Undangan Pernikahan Pribadi</title>
    <meta name="description" content="Undangan pribadi. Gunakan tautan tamu yang dikirimkan oleh pengantin." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Undangan Pernikahan Pribadi" />
    <meta property="og:description" content="Gunakan tautan tamu yang dikirimkan oleh pengantin." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#686F4D" />
    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- The envelope is the first painted asset. Hero layers are low-priority
         prefetches, using their compressed variants, so the cover stays fast
         while the garden is usually cached before the guest opens it. -->
    <link rel="preload" as="image" href="/assets/ivory-garden/envelope-closed.webp" fetchpriority="high" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/hero-curtains-v2.webp" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/couple-clean-v2.webp" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/garden-trees-fast.webp" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/garden-side-cluster-fast.webp" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/grass-carpet-fast.webp" />
    <link rel="prefetch" as="image" href="/assets/ivory-garden/garden-shrubs-fast.webp" />
    <!-- A solid colour is intentionally defined before CSS/JS load. It is a
         reliable fallback in Samsung Internet and on a slow connection. -->
    <style>html,body,#root{min-height:100%;margin:0;background:#F3EADB}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
